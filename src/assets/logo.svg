<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fb3"/>
      <stop offset="0.35" stop-color="#b197fc"/>
      <stop offset="0.7" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0" result="nG"/>
      <feComponentTransfer in="nG" result="nC">
        <feFuncR type="linear" slope="2.5" intercept="-0.75"/>
        <feFuncG type="linear" slope="2.5" intercept="-0.75"/>
        <feFuncB type="linear" slope="2.5" intercept="-0.75"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="nC" mode="overlay"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#g)" filter="url(#grain)"/>
</svg>
