<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc53d"/>
      <stop offset="0.35" stop-color="#ff7a2f"/>
      <stop offset="0.68" stop-color="#f7435c"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <clipPath id="shape"><rect x="0" y="0" width="512" height="512" rx="96"/></clipPath>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.4" intercept="-0.2"/>
        <feFuncG type="linear" slope="1.4" intercept="-0.2"/>
        <feFuncB type="linear" slope="1.4" intercept="-0.2"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <g clip-path="url(#shape)">
    <rect x="0" y="0" width="512" height="512" fill="url(#g)"/>
    <g opacity="0.4">
      <rect x="0" y="0" width="512" height="512" filter="url(#grain)"/>
    </g>
  </g>
  <rect x="46" y="46" width="420" height="420" rx="66" fill="none" stroke="#ffffff" stroke-width="22" stroke-opacity="0.4"/>
</svg>
